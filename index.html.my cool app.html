<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&family=Playwrite+BE+WAL+Guides&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/index.css" />
    <title>my awesome weather app</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city.."
            required
            id="search-form-input"
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div class="weather-app-data">
        <div>
        <h1 class="weather-app-city" id="city">Paris</h1>
          <p class="weather-app-details">
            Sunday 7:00, mostly sunny,
            <br />
            Humidity: <strong>66%</strong> ,wind:<strong>3.14 km/h</strong>
          </p>
        </div>
        <div class="weather-app-temperature-container">
          <div class="weather-app-icon">☀️</div>
          <div class="weather-app-temperature">63</div>
          <div class="weather-app-unit">°F</div>
        </div>
      </main>
      <footer>
        Coded by 
        <a href="https://github.com/fabelanorma3010/" target="_blank"
          >Norma Fabela</a
        >
        code hosted on
        <a
          href="https://github.com/fabelanorma3010/My-cool-weather-app"
          target="_blank"
          >On GitHub</a
        >and webside hosted on
        <a
          href="https://app.netlify.com/projects/my-awesome-weather-app123/overview"
          target="_blank"
          >on netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
